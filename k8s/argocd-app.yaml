apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-devops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YourGitHubUsername/my-devops-project.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
